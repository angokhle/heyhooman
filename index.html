<style>
*{box-sizing:border-box}body{margin:0;background:#15251d;color:#fff9ec;font:16px/1.5 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f8d479;outline-offset:3px}.photo{position:fixed;inset:0;background-size:auto 100%;background-position:left center;background-repeat:no-repeat;background-color:#192d20;transition:opacity .4s;z-index:0}.shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(10,22,15,.15),rgba(10,22,15,.95) 63%),linear-gradient(0deg,#10201899,transparent);z-index:1}.shell{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;padding:32px 6vw;max-width:1600px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:italic 26px Georgia,serif}.loc,.eyebrow,.count{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}.loc{color:#e5d7af}.panel{margin:auto 0 auto auto;width:min(100%,570px);padding:45px 0}.eyebrow{color:#e3c880;margin-bottom:18px}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.05;letter-spacing:-.035em;margin:0 0 22px}h1{font-size:clamp(42px,5.5vw,79px)}h2{font-size:clamp(32px,4vw,51px)}h2:focus{outline:none}em{font-weight:400;color:#e4c98a}p{color:#e1e4d9;max-width:460px;margin:0 0 22px}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;background:#ffffff0b;border:1px solid #ffffff48;color:#fff9ec;padding:12px 17px;border-radius:3px;min-height:48px;transition:background .18s}.choice[aria-pressed=true]{background:#f2d69a;color:#18251b;border-color:#f2d69a}.primary,.back{border:0;padding:14px 25px;border-radius:3px;font-weight:600}.primary{background:#e9ca85;color:#15251d;flex:1}.primary:disabled{opacity:.6;cursor:wait}.back{background:transparent;color:#f5ead3;border:1px solid #ffffff50}.nav{display:flex;gap:12px;margin-top:22px}.bar{height:2px;background:#ffffff35;margin:10px 0 24px}.bar span{display:block;height:100%;background:#e9ca85;transition:width .3s}.err{font-size:13px;color:#ffd19b;min-height:20px;margin-top:10px}.foot{font-size:11px;color:#d1d6c9}.foot a{color:inherit}.field{display:block;margin:12px 0;color:#e7d9b6;font-size:13px}.field input{display:block;width:100%;padding:14px;background:#ffffff0e;border:1px solid #ffffff55;color:white;border-radius:3px;margin-top:6px}input::placeholder{color:#c5c9be}.consent{font-size:13px;color:#e1e4d9;display:block;margin-top:15px}.consent input{accent-color:#e9ca85}.intro .primary{width:100%;max-width:340px;margin-top:8px}.note{font-size:12px;color:#c4cdbf;margin-top:14px}.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(56.3vh - 140px),#192d20 56.3vh)}@media(max-width:700px){.shell{padding:22px 22px 18px}.shade{background:linear-gradient(0deg,#14251dfc 12%,#14251df0 44%,#14251d60 72%,#14251d33)}.photo{background-position:center top;background-size:100% auto;background-color:#14251d}.photo:after{display:none}.panel{padding:28px 0 16px;margin:auto 0 0;width:100%}.intro{padding-top:30vh}.top{align-items:flex-start}.brand{font-size:22px}.loc{font-size:10px}h1{font-size:47px}h2{font-size:35px;margin-bottom:12px}.choice{padding:11px 14px;min-height:44px;font-size:15px}.bar{margin-bottom:18px}.eyebrow{margin-bottom:10px}.foot{margin-top:15px}.shell.question .panel{padding-top:15vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="photo" id="photo" aria-hidden="true"></div>
<div class="shade"></div>
<main class="shell" id="shell">
  <header class="top"><div class="brand">Hey hooman!</div><div class="loc">Chennai, India</div></header>
  <section class="panel" id="panel" aria-live="polite"></section>
  <footer class="foot">Your answers help plan a new dog park in Chennai. Taking part is voluntary. To have your details deleted, write to <a href="mailto:hello@heyhooman.in">hello@heyhooman.in</a>. Illustrative photos.</footer>
</main>
<script>
/* The Google Apps Script web app that saves each response to the Google Sheet.
   Leave it empty to run in PREVIEW MODE, where nothing is saved. See README.md. */
const SURVEY_ENDPOINT = 'https://script.google.com/macros/s/AKfycby4KUXgllT_LcLXf0x1v93LiCOwrvSxEUnAGhmHk5YstN0JyfUyCiZLlUS_RJxaXOqDFg/exec';

/* Background photos. To change one, replace the file in the photos folder with the same name. */
const PHOTOS = {hero: 'photos/hero.jpg', run: 'photos/run.jpg', sniff: 'photos/sniff.jpg', splash: 'photos/splash.jpg', rest: 'photos/rest.jpg'};

/* Each question: title, hint, how many answers (1 = one, 0 = contact details), answers, photo.
   Answer wording must stay the same as the live survey so the sheet stays consistent. */
const QS = [
  {t: 'What do I miss the most?', h: 'Pick up to two.', max: 2, photo: 'run', only: 'Nothing, I have it all!',
   a: ['Running free, off my leash', 'Sniffing new places', 'Training and brain games', 'A calm place to chill', 'Nothing, I have it all!']},
  {t: 'Do any of these sound like me?', h: 'Select all that apply.', max: 6, photo: 'rest', only: 'None of these',
   a: ['I don’t get along with other dogs', 'Stray dogs scare me on walks', 'Our society has strict pet rules', 'I have nowhere to relax', 'The heat cuts my walks short', 'None of these']},
  {t: 'Have you found a stress-free place for us?', h: 'Choose one.', max: 1, photo: 'sniff',
   a: ['Still looking', 'Not yet, but I’d love one', 'We’re happy as we are', 'Yes, it’s:']},
  {t: 'Which part of Chennai do we call home?', h: 'Choose one.', max: 1, photo: 'hero',
   a: ['Central (Adyar, Mylapore, T Nagar)', 'ECR', 'OMR', 'Velachery / Pallikaranai', 'GST Road / Tambaram', 'West & North (Anna Nagar, Porur)', 'Outside Chennai']},
  {t: 'How far would you drive for 90 off-leash minutes?', h: 'Imagine grass, a pool and space for my zoomies.', max: 1, photo: 'splash',
   a: ['30–60 min', '60–90 min', '90+ min', 'I wouldn’t drive that far']},
  {t: 'How much would you pay for those 90 minutes?', h: 'Choose one.', max: 1, photo: 'run',
   a: ['₹4,000–4,999', '₹5,000–5,999', '₹6,000+', 'That’s more than I’d pay']},
  {t: 'How often would you take me there?', h: 'Choose one.', max: 1, photo: 'rest',
   a: ['Every week', '2–3 times a month', 'Once a month', 'A few times a year']},
  {t: 'Can I be one of the first dogs to try it?', h: 'Leave your number and email, hooman! Both are optional.', max: 0, photo: 'hero', a: []}
];
const PLACE_ANSWER = 'Yes, it’s:';
const LAST = QS.length - 1;

let step = -1, answers = QS.map(() => []), place = '', phone = '', email = '', consent = false, honey = '', startedAt = null, sending = false;
const panel = document.getElementById('panel'), photo = document.getElementById('photo'), shell = document.getElementById('shell');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

Object.values(PHOTOS).forEach(src => { const i = new Image(); i.src = src; }); // load all photos up front so steps don't flash

function setPhoto(name) {
  photo.style.backgroundImage = `url('${PHOTOS[name]}')`;
}

function render() {
  shell.classList.toggle('question', step >= 0 && step <= LAST);
  setPhoto(step < 0 || step > LAST ? 'hero' : QS[step].photo);

  if (step === -1) {
    panel.className = 'panel intro';
    panel.innerHTML = `<div class="eyebrow">A little more freedom. A lot more sniffing.</div>
      <h1>Could Chennai have a <em>sensory haven</em> for my paws, nose and soul?</h1>
      <p>Run free. Sniff endlessly. Splash around. Unwind under the trees. Will you help me find it?</p>
      <button class="primary" id="start">Take the 2-minute survey</button>
      <div class="note">8 questions · No sign-in required</div>`;
    document.getElementById('start').onclick = () => { step = 0; if (!startedAt) startedAt = Date.now(); render(); };
    return;
  }

  panel.className = 'panel';
  if (step > LAST) {
    panel.innerHTML = `<div class="eyebrow">The end of our little journey</div>
      <h2 tabindex="-1">Thank you, <em>hooman!</em></h2>
      <p>I’m wagging my tail extra hard for this.</p>
      ${SURVEY_ENDPOINT ? '' : '<p class="note">Preview only: your answers have not been sent or stored.</p>'}`;
    panel.querySelector('h2').focus();
    return;
  }

  const q = QS[step];
  let html = `<div class="count">Question ${step + 1} of ${QS.length}</div>
    <div class="bar" role="progressbar" aria-label="Survey progress" aria-valuenow="${step + 1}" aria-valuemin="0" aria-valuemax="${QS.length}"><span style="width:${(step + 1) / QS.length * 100}%"></span></div>
    <h2 tabindex="-1">${esc(q.t)}</h2><p>${esc(q.h)}</p>
    <div class="choices" role="group" aria-label="${esc(q.t)}">${q.a.map((a, i) => `<button class="choice" type="button" data-i="${i}" aria-pressed="${answers[step].includes(a)}">${esc(a)}</button>`).join('')}</div>`;
  if (answers[step].includes(PLACE_ANSWER)) {
    html += `<label class="field">Name of the place<input id="place" maxlength="100" value="${esc(place)}"></label>`;
  }
  if (step === LAST) {
    html += `<label class="field">Phone (optional)<input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="25" value="${esc(phone)}" placeholder="Your phone number"></label>
      <label class="field">Email (optional)<input id="email" type="email" autocomplete="email" maxlength="120" value="${esc(email)}" placeholder="Your email address"></label>
      <input id="website" class="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" value="">
      <label class="consent"><input id="consent" type="checkbox" ${consent ? 'checked' : ''}> Yes, you can contact me about early access and updates. I can opt out anytime.</label>
      ${SURVEY_ENDPOINT ? '' : '<div class="note">Preview only — no information is transmitted.</div>'}`;
  }
  html += `<div class="nav"><button class="back" type="button" id="back">Back</button><button class="primary" type="button" id="next">${step === LAST ? 'Finish survey' : 'Continue'}</button></div>
    <div class="err" id="err" role="alert"></div>`;
  panel.innerHTML = html;

  panel.querySelectorAll('.choice').forEach(b => b.onclick = () => pick(+b.dataset.i));
  const bind = (id, fn, ev = 'input') => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  bind('place', e => place = e.target.value);
  bind('phone', e => phone = e.target.value);
  bind('email', e => email = e.target.value);
  bind('website', e => honey = e.target.value);
  bind('consent', e => { consent = e.target.checked; if (consent) showError(''); }, 'change');
  document.getElementById('back').onclick = () => { step--; render(); };
  document.getElementById('next').onclick = next;
  window.scrollTo(0, 0);
}

function showError(msg) { const e = document.getElementById('err'); if (e) e.textContent = msg; }

function pick(i) {
  const q = QS[step], value = q.a[i];
  let a = answers[step];
  if (q.max === 1) answers[step] = [value];
  else if (a.includes(value)) answers[step] = a.filter(x => x !== value);
  else if (value === q.only) answers[step] = [value];
  else {
    a = a.filter(x => x !== q.only);
    if (a.length >= q.max) { showError('Please select up to ' + (q.max === 2 ? 'two' : q.max) + '.'); return; }
    answers[step] = [...a, value];
  }
  render();
}

async function next() {
  if (sending) return;
  if (step < LAST && !answers[step].length) { showError('Please choose an answer.'); return; }
  if (answers[step].includes(PLACE_ANSWER) && !place.trim()) { showError('Please enter the name of the place.'); return; }
  if (step < LAST) { step++; render(); return; }

  if (email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) { showError('Please enter a valid email, or leave it blank.'); return; }
  if ((phone.trim() || email.trim()) && !consent) { showError('Please agree to be contacted, or leave the fields blank.'); return; }

  const payload = {
    survey: 'hey-hooman-chennai-v1',
    submittedAt: new Date().toISOString(),
    source: new URLSearchParams(location.search).get('src') || 'direct',
    answers: Object.fromEntries(QS.slice(0, LAST).map((_, i) => ['q' + (i + 1), answers[i]])),
    existingPlace: answers[2].includes(PLACE_ANSWER) ? place.trim() : '',
    phone: phone.trim(), email: email.trim(), contactConsent: consent,
    elapsedSec: startedAt ? Math.round((Date.now() - startedAt) / 1000) : null,
    website: honey
  };

  if (SURVEY_ENDPOINT) {
    const btn = document.getElementById('next');
    sending = true; btn.disabled = true; btn.textContent = 'Sending…'; showError('');
    try {
      // Sent as plain text so Google Apps Script accepts it from this site.
      const res = await fetch(SURVEY_ENDPOINT, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
      const out = await res.json().catch(() => null);
      if (!res.ok || !out || out.ok !== true) throw new Error('not saved');
    } catch (e) {
      sending = false; btn.disabled = false; btn.textContent = 'Try again';
      showError('We couldn’t send your answers. Please check your connection and try again.');
      return;
    }
    sending = false;
  }
  step++;
  render();
}

render();
</script>
</body>
</html>
