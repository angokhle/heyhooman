<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap');
:root{--green:#193d2e;--green2:#285840;--cream:#f9f7ee;--paper:#fffdf6;--yellow:#ffcc48;--leaf:#b7e2a3;--ink:#1a2d22;--muted:#6b776b;--line:#d9dfd4;--err:#ad412c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 90% 0,rgba(183,226,163,.20),transparent 30%),radial-gradient(circle at 0 100%,rgba(255,204,72,.14),transparent 35%)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #eeb627;outline-offset:2px}
.shell{min-height:100svh;display:grid;grid-template-columns:minmax(340px,.95fr) minmax(440px,1.05fr);max-width:1500px;margin:0 auto;position:relative}
.visual{background:var(--green);min-height:100svh;color:white;position:sticky;top:0;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;height:100svh}
.visual-image{position:absolute;inset:0;background:url('assets/park-hero.jpg') center /cover no-repeat;opacity:.82;transform:scale(1.06)}
.visual:after{position:absolute;inset:0;content:"";background:linear-gradient(180deg,rgba(10,34,23,.78) 0%,rgba(10,34,23,.14) 35%,rgba(10,34,23,.14) 62%,rgba(10,34,23,.9) 100%)}
.visual-content{z-index:1;position:relative;padding:clamp(24px,5vw,62px);display:flex;flex-direction:column;min-height:100%;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:Nunito,sans-serif;font-size:24px;line-height:1;font-weight:900;letter-spacing:-1px}
.brand-icon{width:36px;height:36px;display:grid;place-items:center;color:var(--green);background:var(--yellow);border-radius:12px;transform:rotate(-8deg)}
.visual-bottom .location{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow);margin-bottom:16px}
.visual-bottom h1{font-family:Nunito,sans-serif;font-size:clamp(36px,4.6vw,71px);line-height:1.01;letter-spacing:-.055em;margin:0 0 20px;max-width:610px;font-weight:900}
.visual-bottom p{font-size:clamp(14px,1.1vw,18px);line-height:1.65;max-width:410px;margin:0;color:#ecf4e8}
.mini-features{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.mini-features span{border:1px solid #ffffff50;border-radius:100px;padding:7px 12px;font-size:12px;font-weight:700;background:#163a2d77}
.workspace{padding:28px clamp(20px,5vw,84px) 38px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;font-weight:800;color:var(--green2);letter-spacing:.04em;text-transform:uppercase;margin:0 0 16px}.time{background:#e6efdc;padding:8px 12px;border-radius:30px;white-space:nowrap}
.progress{height:7px;background:#e4e8dc;border-radius:12px;overflow:hidden;margin-bottom:35px}.progress-fill{height:100%;width:0%;background:var(--green2);border-radius:12px;transition:width .35s ease}
.card{background:var(--paper);border:1px solid #eceadb;border-radius:28px;padding:clamp(22px,3vw,42px);box-shadow:0 17px 60px #27463111;min-height:440px;display:flex;flex-direction:column;justify-content:center}
.step-kicker{display:inline-flex;align-items:center;gap:8px;color:var(--green2);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:14px}.dot{width:7px;height:7px;border-radius:50%;background:#67a86d}
h2{font-family:Nunito,sans-serif;font-weight:900;letter-spacing:-.05em;font-size:clamp(27px,3vw,42px);line-height:1.14;margin:0 0 10px}
.subtitle{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 24px}
.options{display:grid;gap:10px}.option{border:1.5px solid #e2e6da;border-radius:15px;background:white;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink);font-weight:700;min-height:55px;width:100%;transition:transform .15s ease,border-color .15s ease,background .15s ease;line-height:1.35}.option:hover{border-color:#7ba47e;transform:translateY(-1px)}.option[aria-pressed="true"]{border-color:var(--green2);background:#e9f4e0;box-shadow:inset 0 0 0 1px var(--green2)}
.choice-symbol{font-size:21px;width:28px;text-align:center;flex:none}.choice-label{flex:1}.choice-mark{width:21px;height:21px;border:2px solid #afbbac;border-radius:7px;flex:none;display:grid;place-items:center;color:white;font-size:15px}.option.single .choice-mark{border-radius:50%}.option[aria-pressed="true"] .choice-mark{background:var(--green2);border-color:var(--green2)}
.field{display:grid;gap:7px;margin-top:12px;font-size:12px;font-weight:800;color:var(--green2)}.field input{padding:15px;border-radius:12px;background:white;border:1.5px solid var(--line);font-size:16px;color:var(--ink);width:100%}
.fields-row{display:grid;gap:14px}.optional{font-size:11px;color:var(--muted);font-weight:600}
.opt-in{margin-top:14px;font-size:13px;line-height:1.55;display:flex;gap:10px;color:#44584a;align-items:flex-start}.opt-in input{margin:3px 0 0;accent-color:var(--green2);width:17px;height:17px}
.buttons{display:flex;gap:10px;margin-top:22px;align-items:center;justify-content:space-between}.btn{border:0;border-radius:999px;min-height:54px;padding:0 25px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:15px;white-space:nowrap}.btn-primary{background:var(--yellow);color:#183727;box-shadow:0 5px 0 #e2b137;flex:1}.btn-primary:hover{background:#ffd667}.btn-secondary{background:transparent;border:1.5px solid #d5ddd0;color:var(--green);min-width:110px}.btn:disabled{opacity:.55;cursor:wait}
.error{min-height:19px;color:var(--err);font-size:12px;font-weight:700;margin-top:10px;visibility:hidden}.error.visible{visibility:visible}
.foot{font-size:11px;color:#829083;text-align:center;margin:22px 0 0;line-height:1.5}.foot a{color:inherit}.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.intro .paw{font-size:42px;margin-bottom:22px;display:block}.intro h2{font-size:clamp(34px,3.4vw,50px);margin-bottom:16px}.intro em{font-style:normal;background:linear-gradient(transparent 66%,#ffe18a 66%)}.intro .subtitle{font-size:16px;max-width:460px;margin-bottom:18px}
.callouts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}.callouts span{font-size:12px;font-weight:700;background:#eef3e7;border-radius:22px;padding:8px 11px}
.success{text-align:center;align-items:center}.success h2{font-size:42px}.success .big{font-size:72px}.success p{font-size:16px;color:var(--muted);max-width:360px;line-height:1.65}.success .demo{font-size:12px;background:#fff1db;border-radius:12px;padding:13px 15px;color:#7e551f}
.mobile-photo{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr;max-width:560px;min-height:100svh}.visual{position:relative;min-height:0;height:185px}.visual-content{padding:20px;min-height:0}.visual-bottom{display:none}.visual-image{background-position:center 47%}.visual:after{background:linear-gradient(180deg,#0b3027ba,transparent 75%,#17352788)}.brand{font-size:21px}.workspace{justify-content:flex-start;padding:23px 18px 22px}.progress{margin-bottom:20px}.card{padding:27px 21px;min-height:360px;border-radius:22px}.buttons{margin-top:18px}.option{padding:13px 13px}.foot{margin-top:14px}}
@media(max-width:380px){.visual{height:155px}.workspace{padding:16px 12px}.card{padding:20px 17px}.btn{padding:0 17px;min-height:50px}.btn-secondary{min-width:90px}h2{font-size:27px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

.visual{justify-content:center;align-items:center;background:#203b27;padding:16px;position:sticky}.visual:after{display:none}.campaign{display:block;width:100%;height:100%;object-fit:contain;min-height:0}.hero-start{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);opacity:0;width:78%;height:9%;border:0;cursor:pointer}.hero-start:focus-visible{opacity:1;background:var(--yellow);border-radius:30px;font-weight:800}.shell{grid-template-columns:minmax(340px,1fr) minmax(440px,1fr)}
@media(max-width:900px){.shell{display:block;max-width:600px}.visual{position:relative;height:auto;padding:0;background:#203b27}.campaign{height:auto;width:100%}.hero-start{bottom:5%;height:9%;width:80%}.shell.started .visual{display:none}.workspace{min-height:100svh}.shell:not(.started) .workspace{min-height:0}.shell:not(.started) .card{min-height:0}}
</style>
</head>

function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selected(i,choice){return (answers[i]||[]).includes(choice)}
function render(){
 if(page===1&&!startedAt)startedAt=Date.now();
 document.querySelector('.shell').classList.toggle('started',page>0);
 document.querySelector('.hero-start').hidden=page>0;
 const percent=Math.round((Math.max(0,Math.min(page,8))/8)*100);
 indicator.textContent=page===0?'HEY HOOMAN!':page===9?'ALL DONE':'QUESTION '+page+' OF 8';
 progressFill.style.width=percent+'%';progressbar.setAttribute('aria-valuenow',percent);
 if(page===0){card.innerHTML=`<div class="intro"><span class="paw" aria-hidden="true">🐾</span><div class="step-kicker"><span class="dot"></span> HEY, CHENNAI HOOMANS!</div><h2>Could Chennai have a <em>sensory haven</em> for my paws, nose and soul?</h2><p class="subtitle">Run free, sniff new places, splash around and unwind under the trees. Will you help me find it?</p><div class="callouts"><span>🌳 Loads of shade</span><span>🪵 Natural play</span><span>💦 Splash time</span><span>🔒 Managed spaces</span></div><div class="buttons"><button class="btn btn-primary" id="next">Let's go, hooman! <span aria-hidden="true">→</span></button></div></div>`;document.getElementById('next').onclick=()=>{page=1;render();document.querySelector('.workspace').scrollIntoView({behavior:'smooth'})};return}
 if(page===9){card.classList.add('success');const demo=!SURVEY_ENDPOINT;card.innerHTML=`<div class="big" aria-hidden="true">🐶</div><div class="step-kicker">PAWSOME!</div><h2>That's a tail-wagging thank you!</h2><p>You’ve helped us understand what Chennai dogs need in a sensory haven.</p>${demo?'<p class="demo"><strong>Prototype only:</strong> this preview does not transmit or store survey responses. Connect a secure submission endpoint before sharing publicly.</p>':'<p>Keep an eye out for updates, and give your dog an extra scratch from us.</p>'}<div class="buttons"><button class="btn btn-secondary" id="restart">Start again</button></div>`;document.getElementById('restart').onclick=()=>{page=0;answers={};otherPlace='';phone='';email='';consent=false;honey='';startedAt=null;card.classList.remove('success');render()};return}
 card.classList.remove('success');const i=page-1,s=steps[i];let body=`<div class="step-kicker"><span class="dot"></span> A LITTLE ABOUT YOUR DOG</div><h2>${escapeHTML(s.title)}</h2><p class="subtitle">${escapeHTML(s.hint)}</p>`;
 if(s.type==='contact'){
 body+=`<div class="fields-row"><label class="field">Phone <span class="optional">Optional</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. +91 98765 43210" value="${escapeHTML(phone)}" /></label><label class="field">Email <span class="optional">Optional</span><input id="email" type="email" autocomplete="email" placeholder="you@example.com" value="${escapeHTML(email)}" /></label></div><input id="website" class="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" value="" /><label class="opt-in"><input id="consent" type="checkbox" ${consent?'checked':''} /><span>Yes, you can contact me about early access and updates. I can opt out anytime.</span></label>`;
 } else {
 body+=`<div class="options" role="group" aria-label="${escapeHTML(s.title)}">`+s.answers.map(([icon,label])=>`<button type="button" class="option ${s.type==='single'?'single':''}" data-answer="${escapeHTML(label)}" aria-pressed="${selected(i,label)}"><span class="choice-symbol" aria-hidden="true">${icon}</span><span class="choice-label">${escapeHTML(label)}</span><span class="choice-mark" aria-hidden="true">${selected(i,label)?'✓':''}</span></button>`).join('')+`</div>`;
 if(s.other && selected(i,s.other))body+=`<label class="field" for="other">Where do you go? <span class="optional">Optional</span><input id="other" type="text" maxlength="100" placeholder="Name the place" value="${escapeHTML(otherPlace)}" /></label>`;
 }
 body+=`<div class="error" id="error" role="alert">Choose an option to continue.</div><div class="buttons"><button class="btn btn-secondary" id="back">← Back</button><button class="btn btn-primary" id="next">${page===8?'Send my answers':'Next question'} <span aria-hidden="true">→</span></button></div>`;
 card.innerHTML=body;
 card.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>select(i,btn.dataset.answer)));
 const other=document.getElementById('other');if(other)other.addEventListener('input',e=>otherPlace=e.target.value);
 for(const k of ['phone','email']){const el=document.getElementById(k);if(el)el.addEventListener('input',e=>{if(k==='phone')phone=e.target.value;else email=e.target.value})}
 const hp=document.getElementById('website');if(hp)hp.addEventListener('input',e=>honey=e.target.value);
 const box=document.getElementById('consent');if(box)box.addEventListener('change',e=>{consent=e.target.checked;const er=document.getElementById('error');if(er&&consent)er.classList.remove('visible')});
 document.getElementById('back').onclick=()=>{page--;render()};document.getElementById('next').onclick=next;
 }
function select(i,value){const s=steps[i],a=answers[i]||[];if(s.type==='single'){answers[i]=[value]}else if(s.exclusive?.includes(value)){answers[i]=a.includes(value)?[]:[value]}else{const filtered=a.filter(x=>!s.exclusive?.includes(x));if(filtered.includes(value))answers[i]=filtered.filter(x=>x!==value);else if(!s.max||filtered.length<s.max)answers[i]=[...filtered,value];else{showError('Pick up to '+s.max+' options.');return}}render()}
function showError(msg){const e=document.getElementById('error');if(e){e.textContent=msg;e.classList.add('visible')}}
async function next(){const s=steps[page-1],a=answers[page-1]||[];if(s.type!=='contact'&&!a.length){showError('Choose at least one option to continue.');return}
 if(page<8){page++;render();return}
 if(email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())){showError('Please check the email address, or leave it blank.');return}
 if((phone.trim()||email.trim())&&!consent){showError('Please agree to be contacted, or remove your contact details.');return}
 const payload={survey:'hey-hooman-chennai-v1',submittedAt:new Date().toISOString(),source:new URLSearchParams(location.search).get('src')||'direct',answers:Object.fromEntries(steps.slice(0,7).map((x,i)=>['q'+(i+1),answers[i]||[]])),existingPlace:selected(2,'Yes, it’s:')?otherPlace.trim():'',phone:phone.trim(),email:email.trim(),contactConsent:consent,elapsedSec:startedAt?Math.round((Date.now()-startedAt)/1000):null,website:honey};
 const btn=document.getElementById('next');btn.disabled=true;btn.textContent='Sending…';
 if(SURVEY_ENDPOINT){try{const res=await fetch(SURVEY_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const out=await res.json().catch(()=>null);if(!res.ok||!out||out.ok!==true)throw new Error('Submission failed');}catch(e){btn.disabled=false;btn.textContent='Try again →';showError('We couldn’t send your response. Please try again.');return}}
 page=9;render();}
render();
</script>
</body>
</html>
