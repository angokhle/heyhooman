<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15251d">
<title>Hey hooman! — Results</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<style>
:root{
  --page:#15251d; --surface:#1c2e24; --hairline:#2e4237;
  --ink:#fff9ec; --ink-2:#c9d0c4; --ink-3:#97a397;
  --accent:#e9ca85; --deemph:#6b7a70; --warn:#ffd19b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font:italic 26px Georgia,serif}
.brand span{font:600 11px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-left:10px;font-style:normal}
.linkbtn{background:none;border:0;color:var(--ink-3);text-decoration:underline;cursor:pointer;padding:4px}
/* key screen */
.gate{max-width:420px;margin:12vh auto 0}
.gate h1{font:400 34px/1.1 Georgia,serif;margin:0 0 10px}
.gate p{color:var(--ink-2);margin:0 0 18px}
.gate input{width:100%;padding:13px;background:#ffffff0e;border:1px solid #ffffff55;color:var(--ink);border-radius:3px}
.primary{margin-top:12px;width:100%;background:var(--accent);color:var(--page);border:0;border-radius:3px;padding:13px;font-weight:600;cursor:pointer}
.msg{color:var(--warn);font-size:13px;min-height:20px;margin-top:10px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 0 16px;border-bottom:1px solid var(--hairline);margin-bottom:20px}
.filters label{display:flex;gap:7px;align-items:center;color:var(--ink-2);font-size:14px}
.filters select{background:var(--surface);color:var(--ink);border:1px solid var(--hairline);border-radius:3px;padding:7px 10px}
.filters input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.filters .spacer{flex:1}
.refresh{background:transparent;color:var(--ink);border:1px solid #ffffff50;border-radius:3px;padding:7px 14px;cursor:pointer}
.updated{font-size:12px;color:var(--ink-3)}
#content.loading{opacity:.45;transition:opacity .2s}
/* figures */
.hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
.hero .num{font:600 56px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em}
.hero .lbl{color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.tile{background:var(--surface);border-radius:6px;padding:14px 16px}
.tile .label{font-size:13px;color:var(--ink-2)}
.tile .value{font:600 30px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;margin-top:4px}
.tile .sub{font-size:12px;color:var(--ink-3)}
.tile.key{box-shadow:inset 3px 0 0 var(--accent)}
/* chart cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border-radius:6px;padding:16px 18px 12px;position:relative}
.card h2{font:600 15px/1.35 system-ui,sans-serif;margin:0}
.card .meta{font-size:12px;color:var(--ink-3);margin:2px 0 14px}
.bars{border-left:1px solid var(--hairline);padding-left:0}
.row{display:block;padding:5px 0 7px 10px;border-radius:3px;cursor:default;outline:none}
.row:hover,.row:focus-visible{background:#ffffff08}
.row .name{font-size:13px;color:var(--ink-2);margin-bottom:3px}
.track{display:flex;align-items:center;gap:8px;height:14px}
.bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px;transition:width .3s}
.bar.dim{background:var(--deemph)}
.bar.zero{min-width:0;width:0!important}
.pct{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin:-6px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
details{margin-top:10px;font-size:13px}
summary{color:var(--ink-3);cursor:pointer;width:max-content}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
th,td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--hairline)}
th{color:var(--ink-3);font-weight:600}
td.n{font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
.section{margin:30px 0 10px;font:400 24px Georgia,serif}
.empty{color:var(--ink-2);padding:30px 0}
.tip{position:fixed;pointer-events:none;background:#0d1712;border:1px solid var(--hairline);border-radius:4px;padding:7px 10px;font-size:13px;z-index:10;display:none;max-width:260px}
.tip b{display:block;font-size:15px;color:var(--ink)}
.tip span{color:var(--ink-2)}
@media(max-width:560px){.hero .num{font-size:48px}.tiles{grid-template-columns:1fr 1fr}.tile .value{font-size:24px}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Hey hooman!<span>Survey results</span></div>
    <button class="linkbtn" id="forget" hidden>Forget key on this device</button>
  </header>
  <div id="app"></div>
</div>
<div class="tip" id="tip" role="status"></div>
<script>
/* Same Google Apps Script address as the survey page. */
const SURVEY_ENDPOINT = 'https://script.google.com/macros/s/AKfycby4KUXgllT_LcLXf0x1v93LiCOwrvSxEUnAGhmHk5YstN0JyfUyCiZLlUS_RJxaXOqDFg/exec';
const KEY_STORE = 'hh-results-key';

/* Answer options in survey order. Older wording is listed too, so early responses still count.
   good = answers that fit Illalur (shown in gold on the drive and price charts). */
const QUESTIONS = [
  {id: 'q1', title: 'What do I miss the most?', multi: true, rank: true,
   options: ['Running free, off my leash', 'Sniffing new places', 'Training and brain games', 'A calm place to chill', 'Nothing, I have it all!']},
  {id: 'q2', title: 'Do any of these sound like me?', multi: true, rank: true,
   options: ['I don’t get along with other dogs', 'Stray dogs scare me on walks', 'Our society has strict pet rules', 'I have nowhere to relax', 'The heat cuts my walks short', 'None of these']},
  {id: 'q3', title: 'Have you found a stress-free place for us?',
   options: ['Still looking', 'Not yet, but I’d love one', 'We’re happy as we are', 'Yes, it’s:']},
  {id: 'q4', title: 'Which part of Chennai do we call home?', rank: true,
   options: ['Central (Adyar, Mylapore, T Nagar)', 'ECR', 'OMR', 'Velachery / Pallikaranai', 'GST Road / Tambaram', 'West & North (Anna Nagar, Porur)', 'Outside Chennai']},
  {id: 'q5', title: 'How far would you drive for 90 off-leash minutes?', emphasis: true,
   options: ['Under 30 min', '30–60 min', '60–90 min', '90+ min', 'I wouldn’t drive that far'],
   good: ['60–90 min', '90+ min'], legacy: ['Under 30 min']},
  {id: 'q6', title: 'How much would you pay for those 90 minutes?', emphasis: true,
   options: ['Below ₹4,000', '₹4,000–4,999', '₹5,000–5,999', '₹6,000+', 'That’s more than I’d pay'],
   good: ['₹4,000–4,999', '₹5,000–5,999', '₹6,000+'], legacy: ['Below ₹4,000']},
  {id: 'q7', title: 'How often would you take me there?',
   options: ['Every week', '2–3 times a month', 'Once a month', 'A few times a year']},
];
const SOURCE_NAMES = {whatsapp: 'WhatsApp', instagram: 'Instagram', direct: 'Direct link', test: 'Test'};

let key = '', rows = [], fetchedAt = null;
const state = {source: 'all', hideTest: true, hideFast: true};
const app = document.getElementById('app'), tip = document.getElementById('tip'), forgetBtn = document.getElementById('forget');

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c.nodeType ? c : document.createTextNode(String(c))));
  return n;
}
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const store = {
  get() { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } },
  set(v) { try { localStorage.setItem(KEY_STORE, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }
};

/* ---------- key screen ---------- */
function showGate(message = '') {
  forgetBtn.hidden = true;
  const input = el('input', {type: 'password', id: 'key', autocomplete: 'current-password', placeholder: 'Results key', 'aria-label': 'Results key'});
  const msg = el('div', {class: 'msg', role: 'alert', text: message});
  const btn = el('button', {class: 'primary', type: 'submit', text: 'Show results'});
  const form = el('form', {class: 'gate', onsubmit: async e => {
    e.preventDefault();
    if (!input.value.trim()) { msg.textContent = 'Please enter the key.'; return; }
    btn.disabled = true; btn.textContent = 'Checking…';
    key = input.value.trim();
    const err = await load();
    if (err) { btn.disabled = false; btn.textContent = 'Show results'; msg.textContent = err; key = ''; }
  }}, el('h1', {text: 'Survey results'}), el('p', {text: 'Enter the results key to see how Chennai’s dog parents answered. Phone numbers and emails are never shown here.'}), input, btn, msg);
  app.replaceChildren(form);
  input.focus();
}

/* ---------- data ---------- */
async function load() {
  try {
    const res = await fetch(`${SURVEY_ENDPOINT}?view=summary&key=${encodeURIComponent(key)}&t=${Date.now()}`);
    const out = await res.json();
    if (!out.ok) { store.clear(); return 'That key didn’t work. Check it and try again.'; }
    if (!Array.isArray(out.rows)) return 'The sheet’s script needs the latest update before results can show. See the README.';
    rows = out.rows; fetchedAt = new Date();
    store.set(key);
    render();
    return '';
  } catch (e) {
    return 'Couldn’t reach the sheet. Check your connection and try again.';
  }
}

function filtered() {
  return rows.filter(r => {
    const src = (r.source || 'direct').toLowerCase();
    if (state.hideTest && src === 'test') return false;
    if (state.hideFast && r.seconds != null && r.seconds < 10) return false;
    if (state.source !== 'all' && src !== state.source) return false;
    return true;
  });
}

function count(q, list) {
  const answered = list.filter(r => r[q.id]);
  const counts = new Map(q.options.map(o => [o, 0]));
  for (const r of answered) {
    const cell = r[q.id];
    if (q.multi) { q.options.forEach(o => { if (cell.includes(o)) counts.set(o, counts.get(o) + 1); }); }
    else counts.set(cell, (counts.get(cell) || 0) + 1);
  }
  let items = [...counts].map(([name, n]) => ({name, n}));
  items = items.filter(it => it.n > 0 || !(q.legacy || []).includes(it.name)); // hide old options nobody chose
  if (q.rank) items.sort((a, b) => b.n - a.n);
  return {items, base: answered.length};
}

/* ---------- rendering ---------- */
function render() {
  forgetBtn.hidden = false;
  const list = filtered();
  const sources = [...new Set(rows.map(r => (r.source || 'direct').toLowerCase()))].sort();

  const select = el('select', {id: 'src', 'aria-label': 'Channel', onchange: e => { state.source = e.target.value; render(); }},
    el('option', {value: 'all', text: 'All channels'}), sources.map(s => el('option', {value: s, text: SOURCE_NAMES[s] || s})));
  select.value = sources.includes(state.source) ? state.source : 'all';
  const check = (label, prop) => el('label', {}, el('input', {type: 'checkbox', ...(state[prop] ? {checked: ''} : {}), onchange: e => { state[prop] = e.target.checked; render(); }}), label);
  const refresh = el('button', {class: 'refresh', type: 'button', text: 'Refresh', onclick: async () => {
    content.classList.add('loading'); refresh.disabled = true;
    const err = await load();
    if (err) { content.classList.remove('loading'); refresh.disabled = false; updated.textContent = err; }
  }});
  const updated = el('span', {class: 'updated', text: 'Updated ' + fetchedAt.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})});
  const filters = el('div', {class: 'filters'}, el('label', {}, 'Channel', select), check('Hide test responses', 'hideTest'), check('Hide answers under 10 seconds', 'hideFast'), el('span', {class: 'spacer'}), updated, refresh);

  const content = el('div', {id: 'content'});
  if (!list.length) {
    content.append(el('p', {class: 'empty', text: rows.length ? 'No responses match these filters yet.' : 'No responses yet. Share heyhooman.in and they’ll appear here.'}));
    app.replaceChildren(filters, content);
    return;
  }

  // Headline numbers for the Illalur decision
  const q5 = list.filter(r => r.q5), q6 = list.filter(r => r.q6), q3 = list.filter(r => r.q3);
  const far = r => ['60–90 min', '90+ min'].includes(r.q5);
  const pays4 = r => ['₹4,000–4,999', '₹5,000–5,999', '₹6,000+'].includes(r.q6);
  const pays5 = r => ['₹5,000–5,999', '₹6,000+'].includes(r.q6);
  const both = list.filter(r => r.q5 && r.q6);
  const looking = q3.filter(r => ['Still looking', 'Not yet, but I’d love one'].includes(r.q3)).length;
  const signups = list.filter(r => r.signedUp).length;
  const tile = (label, value, sub, cls = '') => el('div', {class: 'tile ' + cls}, el('div', {class: 'label', text: label}), el('div', {class: 'value', text: value}), el('div', {class: 'sub', text: sub}));
  const share = (n, d) => `${pct(n, d)}%`;
  const ofN = (n, d) => `${n} of ${d}`;

  content.append(
    el('div', {class: 'hero'}, el('span', {class: 'num', text: list.length.toLocaleString('en-IN')}), el('span', {class: 'lbl', text: list.length === 1 ? 'response' : 'responses'})),
    el('div', {class: 'tiles'},
      tile('Would drive 60+ min', share(q5.filter(far).length, q5.length), ofN(q5.filter(far).length, q5.length) + ' · Illalur is ~75 min from Adyar', 'key'),
      tile('Would pay ₹4,000+', share(q6.filter(pays4).length, q6.length), ofN(q6.filter(pays4).length, q6.length), 'key'),
      tile('Drive 60+ min and pay ₹4,000+', share(both.filter(r => far(r) && pays4(r)).length, both.length), ofN(both.filter(r => far(r) && pays4(r)).length, both.length) + ' · your likeliest customers', 'key'),
      tile('Would pay ₹5,000+', share(q6.filter(pays5).length, q6.length), ofN(q6.filter(pays5).length, q6.length)),
      tile('Want a stress-free place', share(looking, q3.length), ofN(looking, q3.length) + ' still looking or would love one'),
      tile('Early-access sign-ups', signups.toLocaleString('en-IN'), 'agreed to be contacted')
    ),
    el('h2', {class: 'section', text: 'Every question'}),
    el('div', {class: 'grid'}, QUESTIONS.map(q => chart(q, list))),
    el('h2', {class: 'section', text: 'Breakdowns'}),
    el('div', {class: 'grid'}, areaTable(list, far, pays4), channelTable(list), placesTable(list))
  );
  app.replaceChildren(filters, content);
}

function chart(q, list) {
  const {items, base} = count(q, list);
  const max = Math.max(1, ...items.map(i => i.n));
  const card = el('section', {class: 'card'}, el('h2', {text: q.title}),
    el('div', {class: 'meta', text: `${base} answered` + (q.multi ? ' · people could pick more than one, so shares add up to over 100%' : '')}));
  if (q.emphasis) card.append(el('div', {class: 'legend'}, el('span', {}, el('i', {style: 'background:var(--accent)'}), 'Fits Illalur'), el('span', {}, el('i', {style: 'background:var(--deemph)'}), 'Doesn’t')));
  const bars = el('div', {class: 'bars', role: 'list'});
  for (const it of items) {
    const share = pct(it.n, base);
    const dim = q.emphasis && !q.good.includes(it.name);
    const bar = el('div', {class: 'bar' + (dim ? ' dim' : '') + (it.n ? '' : ' zero'), style: `width:calc((100% - 52px) * ${it.n / max})`});
    const row = el('div', {class: 'row', role: 'listitem', tabindex: '0', 'aria-label': `${it.name}: ${it.n} of ${base}, ${share}%`},
      el('div', {class: 'name', text: it.name}), el('div', {class: 'track'}, bar, el('span', {class: 'pct', text: share + '%'})));
    const show = e => showTip(e, row, `${it.n} of ${base} · ${share}%`, it.name);
    row.addEventListener('pointermove', show); row.addEventListener('focus', show);
    row.addEventListener('pointerleave', hideTip); row.addEventListener('blur', hideTip);
    bars.append(row);
  }
  card.append(bars, tableView(['Answer', 'People', 'Share'], items.map(it => [it.name, it.n, pct(it.n, base) + '%'])));
  return card;
}

function tableView(head, body, open = false) {
  return el('details', open ? {open: ''} : {}, el('summary', {text: open ? 'Table' : 'Show as table'}),
    el('table', {}, el('thead', {}, el('tr', {}, head.map((h, i) => el('th', {class: i ? 'n' : '', text: h})))),
      el('tbody', {}, body.map(r => el('tr', {}, r.map((c, i) => el('td', {class: i ? 'n' : '', text: c})))))));
}

function areaTable(list, far, pays4) {
  const q = QUESTIONS[3], groups = new Map();
  list.filter(r => r.q4).forEach(r => { if (!groups.has(r.q4)) groups.set(r.q4, []); groups.get(r.q4).push(r); });
  const body = [...groups].sort((a, b) => b[1].length - a[1].length).map(([area, rs]) => {
    const d5 = rs.filter(r => r.q5), d6 = rs.filter(r => r.q6);
    return [area, rs.length, d5.length ? pct(d5.filter(far).length, d5.length) + '%' : '–', d6.length ? pct(d6.filter(pays4).length, d6.length) + '%' : '–'];
  });
  return el('section', {class: 'card'}, el('h2', {text: 'By area'}), el('div', {class: 'meta', text: 'Where the people willing to make the drive live'}),
    tableView(['Area', 'Responses', 'Drive 60+', 'Pay ₹4,000+'], body, true));
}

function channelTable(list) {
  const groups = new Map();
  list.forEach(r => { const s = (r.source || 'direct').toLowerCase(); if (!groups.has(s)) groups.set(s, []); groups.get(s).push(r); });
  const body = [...groups].sort((a, b) => b[1].length - a[1].length).map(([s, rs]) => [SOURCE_NAMES[s] || s, rs.length, rs.filter(r => r.signedUp).length]);
  return el('section', {class: 'card'}, el('h2', {text: 'By channel'}), el('div', {class: 'meta', text: 'From the ?src= in each shared link'}),
    tableView(['Channel', 'Responses', 'Sign-ups'], body, true));
}

function placesTable(list) {
  const groups = new Map();
  list.map(r => (r.place || '').trim()).filter(Boolean).forEach(p => {
    const k = p.toLowerCase(); const g = groups.get(k) || {name: p, n: 0}; g.n++; groups.set(k, g);
  });
  const body = [...groups.values()].sort((a, b) => b.n - a.n).map(g => [g.name, g.n]);
  return el('section', {class: 'card'}, el('h2', {text: 'Places people already use'}), el('div', {class: 'meta', text: 'Named in “Yes, it’s:” on the stress-free place question'}),
    body.length ? tableView(['Place', 'Mentions'], body, true) : el('p', {class: 'meta', text: 'None named yet.'}));
}

function showTip(e, row, value, name) {
  tip.replaceChildren(el('b', {text: value}), el('span', {text: name}));
  tip.style.display = 'block';
  const r = row.getBoundingClientRect();
  const x = e.clientX || r.left + 20, y = (e.clientY || r.top) - tip.offsetHeight - 12;
  tip.style.left = Math.min(Math.max(8, x - tip.offsetWidth / 2), innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

forgetBtn.onclick = () => { store.clear(); key = ''; rows = []; showGate(); };

/* Start: a key in the link (#key=...) or one saved on this device opens the results straight away. */
async function start() {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('key');
  if (fromHash) history.replaceState(null, '', location.pathname); // keep the key out of the address bar
  key = fromHash || store.get();
  if (!key) return showGate();
  app.replaceChildren(el('p', {class: 'empty', text: 'Loading results…'}));
  const err = await load();
  if (err) showGate(err);
}
window.addEventListener('hashchange', () => { if (location.hash.includes('key=')) start(); });
start();
</script>
</body>
</html>
